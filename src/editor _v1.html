<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Tiptap Vanilla JS</title>
    <link href="./Style/CSS/tiptap-editor.css" rel="stylesheet" type="text/css" />
</head>

<script>
    var editor;
</script>
<!-- Tiptap 編輯器載入、監聽、顯示 -->
<script type="module">
    import { initEditor } from './TiptapEditor/editor.js';
    import { editorController } from './TiptapEditor/editor-controller.js';

    editor = initEditor();
    editorController(editor);
</script>

<body>

    <h3>Tiptap 編輯器</h3>
    <!-- 表格設定視窗 -->
    <dialog id="tableDialog" class="editor-modal">
        <div class="modal-header">表格設定</div>
        <div class="modal-body">
            <div class="input-group">
                <label for="tableRows-num">行數 (Rows)</label>
                <input type="number" id="tableRows-num" value="3" min="1" max="20" />
            </div>
            <div class="input-group">
                <label for="tableCols-num">列數 (Cols)</label>
                <input type="number" id="tableCols-num" value="3" min="1" max="20" />
            </div>
            <div class="input-group">
                <label for="tableBorder-num">框線大小 (px)</label>
                <input type="number" id="tableBorder-num" value="1" min="0" max="10" />
            </div>
            <div class="input-group">
                <label for="tableWidth-num">表格寬度 (px)</label>
                <input type="number" id="tableWidth-num" value="500" min="0" />
            </div>
        </div>
        <div class="modal-footer">
            <button id="tableCancel-btn" class="btn-secondary">取消</button>
            <button id="tableConfirm-btn" class="btn-primary">確認</button>
        </div>
    </dialog>
    <div class="editor-container" id="editor-container">
        <!-- #region 文字編輯器 -->
        <!-- 核心紙張區塊：限制最大寬度 -->
        <div class="paper-wrapper">
            <!-- 1. 定義工具列 -->
            <div class="editor-toolbar" id="toolbar">
                <!-- 字型 -->
                <select id="fontFamily-select" title="字型" style="font-family: inherit;">
                    <option value="" style="font-family: inherit;">預設字型</option>
                    <option value="Arial, sans-serif" style="font-family: Arial, sans-serif;">Arial</option>
                    <option value="'Times New Roman', serif" style="font-family: &quot;Times New Roman&quot;, serif;">
                        Times New
                        Roman
                    </option>
                    <option value="'Courier New', monospace" style="font-family: &quot;Courier New&quot;, monospace;">
                        Courier
                        New
                    </option>
                    <option value="Georgia, serif" style="font-family: Georgia, serif;">Georgia</option>
                    <option value="Verdana, sans-serif" style="font-family: Verdana, sans-serif;">Verdana</option>
                    <option value="'Microsoft JhengHei', sans-serif"
                        style="font-family: &quot;Microsoft JhengHei&quot;, sans-serif;">
                        微軟正黑體
                    </option>
                    <option value="'Microsoft YaHei', sans-serif"
                        style="font-family: &quot;Microsoft YaHei&quot;, sans-serif;">
                        微軟雅黑體
                    </option>
                    <option value="'PMingLiU', serif" style="font-family: PMingLiU, serif;">新細明體</option>
                    <option value="'MingLiU', serif" style="font-family: MingLiU, serif;">細明體</option>
                    <option value="'DFKai-SB', serif" style="font-family: DFKai-SB, serif;">標楷體</option>
                </select>
                <!-- 字體大小 -->
                <select id="fontSize-select" title="字體大小">
                    <option value="">預設</option>
                    <option value="8px" style="font-size: 8px;">8</option>
                    <option value="9px" style="font-size: 9px;">9</option>
                    <option value="10px" style="font-size: 10px;">10</option>
                    <option value="11px" style="font-size: 11px;">11</option>
                    <option value="12px" style="font-size: 12px;">12</option>
                    <option value="14px" style="font-size: 14px;">14</option>
                    <option value="16px" style="font-size: 16px;">16</option>
                    <option value="18px" style="font-size: 18px;">18</option>
                    <option value="20px" style="font-size: 20px;">20</option>
                    <option value="22px" style="font-size: 22px;">22</option>
                    <option value="24px" style="font-size: 24px;">24</option>
                    <option value="28px" style="font-size: 28px;">28</option>
                    <option value="32px" style="font-size: 32px;">32</option>
                    <option value="36px" style="font-size: 36px;">36</option>
                    <option value="48px" style="font-size: 48px;">48</option>
                    <option value="72px" style="font-size: 72px;">72</option>
                </select>
                <span class="divider"></span>
                <button id="bold-btn" title="粗體"><b>B</b></button>
                <button id="italic-btn" title="斜體"><i>I</i></button>
                <button id="underline-btn" title="底線"><u>U</u></button>
                <span class="divider"></span>
                <div style="position: relative; display: inline-block;">
                    <button id="fontColor-btn" class="button-LB" title="文字顏色">
                        <span style="text-decoration: underline rgb(0, 0, 0);">A</span>
                    </button>
                    <input type="color" id="hiddenFontColorPicker" class="color-picker" />
                </div>
                <button id="clearFontColor" title="清除顏色">
                    <span style="text-decoration: underline rgb(204, 204, 204);">A</span>
                </button>
                <div style="position: relative; display: inline-block;">
                    <button id="backgroundColor-btn" class="button-LB" title="背景色">
                        <span style="background: rgb(255, 255, 0);">H</span>
                    </button>
                    <input type="color" id="hiddenBackgroundColorPicker" class="color-picker" />
                </div>
                <button id="clearBackgroundColor" title="清除背景色">
                    <span style="background: rgb(238, 238, 238); padding: 0px 2px;">H</span>
                </button>
                <span class="divider"></span>
                <button id="alignLeft-btn" title="靠左">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 5h18v2H3zm0 4h12v2H3zm0 4h18v2H3zm0 4h12v2H3z"></path>
                    </svg>
                </button>
                <button id="alignCenter-btn" title="置中">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 5h18v2H3zm3 4h12v2H6zm-3 4h18v2H3zm3 4h12v2H6z"></path>
                    </svg>
                </button>
                <button id="alignRight-btn" title="靠右">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 5h18v2H3zm6 4h12v2H9zm-6 4h18v2H3zm6 4h12v2H9z"></path>
                    </svg>
                </button>
                <button id="justify-btn" title="左右對齊">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 5h18v2H3zm0 4h18v2H3zm0 4h18v2H3zm0 4h18v2H3z"></path>
                    </svg>
                </button>
                <span class="divider"></span>
                <button id="list-btn" title="無序清單">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M4 6a1 1 0 1 1-2 0 1 1 0 0 1 2 0
                    zm0 6a1 1 0 1 1-2 0 1 1 0 0 1 2 0
                    zm0 6a1 1 0 1 1-2 0 1 1 0 0 1 2 0
                    M7 5h14v2H7zm0 6h14v2H7zm0 6h14v2H7z"></path>
                    </svg>
                </button>
                <button id="numlist-btn" title="有序清單">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path data-v-42c014aa=""
                            d="M3 4h1v4H3zm0 6h1v1H2.5v-.5H3V10zm0 5h1v.5H3v.5h1V17H2v-1h1zm4-10h14v2H7zm0 6h14v2H7zm0 6h14v2H7z">
                        </path>
                    </svg>
                </button>
                <button id="decreaseIndent-btn" title="減少縮排">
                    <svg data-v-42c014aa="" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path data-v-42c014aa="" d="M3 5h18v2H3zm0 12h18v2H3zm0-6h18v2H3zM7 9l-4 3 4 3V9z"></path>
                    </svg>
                </button>
                <button id="increaseIndent-btn" title="增加縮排">
                    <svg data-v-42c014aa="" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path data-v-42c014aa="" d="M3 5h18v2H3zm0 12h18v2H3zm0-6h18v2H3zm4 6V9l4 3-4 3z"></path>
                    </svg>
                </button>
                <span class="divider"></span>
                <button id="quote-btn" title="引用段落">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"></path>
                    </svg>
                </button>
                <button id="horizon-btn" title="插入水平線">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 11h18v2H3z"></path>
                    </svg>
                </button>
                <button id="table-btn" title="插入表格">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path data-v-42c014aa=""
                            d="M3 3h18v18H3V3zm2 8v4h6v-4H5zm0 6v4h6v-4H5zm8 0v4h6v-4h-6zm0-6v4h6v-4h-6zm0-6v4h6V5h-6zM5 5v4h6V5H5z">
                        </path>
                    </svg>
                </button>
                <button id="deleteTable-btn" disabled=disabled title="刪除表格">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path data-v-42c014aa=""
                            d="M3 3h18v18H3V3zm2 8v4h6v-4H5zm0 6v4h6v-4H5zm8 0v4h6v-4h-6zm0-6v4h6v-4h-6zm0-6v4h6V5h-6zM5 5v4h6V5H5zm-.354-.354l.708-.707 18 18-.708.707-18-18zm2.122-2.122L1.31 3.98l1.414 1.415 3.42-3.42-.772-.773zm13.16 19.387l3.418-3.419 1.414 1.414-3.419 3.419-1.414-1.414z">
                        </path>
                    </svg>
                </button>
                <span class="divider"></span>
                <button id="link-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                    </svg>
                </button>
                <button id="importImage-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                </button>
                <button id="findReplace-btn" title="尋找與取代">
                    <svg data-v-42c014aa="" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path data-v-42c014aa="" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16
                    c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5z
                    m-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
                    </svg>
                </button>
                <span class="divider"></span>
                <button id="undo-btn" disabled=disabled title="復原 (Ctrl+Z)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9
                    l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88
                    c3.54 0 6.55 2.31 7.6 5.5l2.37-.78
                    C21.08 11.03 17.15 8 12.5 8z"></path>
                    </svg>
                </button>
                <button id="redo-btn" disabled=disabled title="重做 (Ctrl+Y)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8
                    c-4.65 0-8.58 3.03-9.96 7.22L3.9 16
                    c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88
                    L13 16h9V7l-3.6 3.6z"></path>
                    </svg>
                </button>
                <span class="divider"></span>
                <button id="fullScreen-btn" title="最大化">
                    <svg data-v-42c014aa="" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path data-v-42c014aa=""
                            d="M3 3h7v2H5v5H3V3zm11 0h7v7h-2V5h-5V3zM3 14h2v5h5v2H3v-7zm16 5h-5v2h7v-7h-2v5z"></path>
                    </svg>
                </button>
            </div>

            <!-- 超連結輸入列(預設隱藏) -->
            <div class="editor-sub-toolbar" id="link-input-bar">
                <div style="display: flex; width: 100%;">
                    <input type="text" id="linkHref-input" placeholder="輸入連結網址..." class="link-input" />
                    <div class="sub-toolbar-actions">
                        <button id="linkConfirm-btn" class="btn-sub-primary">確認</button>
                        <button id="linkRemove-btn" class="btn-sub-danger">移除</button>
                        <button id="linkCancel-btn" class="btn-sub-secondary">取消</button>
                    </div>
                </div>
            </div>

            <!-- 圖片輸入列(預設隱藏) -->
            <div class="editor-sub-toolbar" id="image-input-bar">
                <div style="display: flex; width: 100%;">
                    <input type="text" id="imageHref-input" placeholder="輸入圖片網址..." class="link-input" />
                    <div class="sub-toolbar-actions">
                        <button id="imageUpload-btn" class="btn-sub-primary">上傳</button>
                        <input type="file" id="image-file" accept="image/*" style="display: none;" />
                        <button id="imageConfirm-btn" class="btn-sub-primary">插入</button>
                        <button id="imageCancel-btn" class="btn-sub-secondary">取消</button>
                    </div>
                </div>
            </div>

            <!-- 搜尋與取代輸入列(預設隱藏) -->
            <div class="editor-sub-toolbar" id="search-replace-input-bar">
                <div style="display: flex; width: 100%;">
                    <input type="text" id="search-input" placeholder="搜尋..." class="link-input" />
                    <div class="sub-toolbar-actions">
                        <button id="searchnext-btn" class="btn-sub-primary">下一個</button>
                    </div>
                </div>
                <div style="display: flex; width: 100%;">
                    <input type="text" id="replace-input" placeholder="取代為..." class="link-input" />
                    <div class="sub-toolbar-actions">
                        <button id="replace-btn" class="btn-sub-primary">取代</button>
                        <button id="replaceall-btn" class="btn-sub-primary">全部取代</button>
                    </div>
                </div>
                <div class="sub-toolbar-actions">
                    <label>
                        <input type="checkbox" id="matchCase-chk" />
                        大小寫須相符
                    </label>
                    <label>
                        <input type="checkbox" id="wholeWord-chk" />
                        全字拼寫須相符
                    </label>
                    <label>
                        <input type="checkbox" id="wrapSearch-chk" checked=checked />
                        循環搜尋
                    </label>
                    <button id="search-replace-Cancel-btn" class="btn-sub-secondary">關閉</button>
                </div>
            </div>

            <!-- 文字編輯區塊 -->
            <div class="editor-content" id="tiptap-editor"></div>
        </div>
        <!-- #endregion 文字編輯器 -->
    </div>
    <!-- 儲存/輸出按鈕 -->
    <button id="save-btn" style="margin-top: 10px; background: #28a745; color: white;">輸出 HTML</button>

    <!-- 測試範本 -->
    <button id="EditorEnable-btn" style="margin-top: 10px; background: #28a745; color: white;">測試範本</button>

    <!-- 用來顯示輸出結果的區塊 -->
    <pre id="output" style="background: #eee; padding: 10px; margin-top: 10px; white-space: pre-wrap;"></pre>


</body>
